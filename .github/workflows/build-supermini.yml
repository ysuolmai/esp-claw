name: Build ESP32-S3 SuperMini

on:
  push:
    branches:
      - main
      - master
      - esp32-s3-supermini
  pull_request:
    paths:
      - ".github/workflows/build-supermini.yml"
      - "application/edge_agent/**"
      - "components/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    defaults:
      run:
        shell: bash
        working-directory: application/edge_agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 SuperMini firmware
        run: |
          . /opt/esp/idf/export.sh
          pip install esp-bmgr-assist
          rm -rf build sdkconfig sdkconfig.old managed_components dependencies.lock
          idf.py bmgr -c ./boards -b esp32_S3_Super_Mini
          grep -E 'CONFIG_(ESPTOOLPY_FLASHSIZE_4MB|PARTITION_TABLE_CUSTOM_FILENAME|SPIRAM_MODE_QUAD|APP_CLAW_CAP_(IM_PLATFORM|IM_TG|MCP_CLIENT|MCP_SERVER|SCHEDULER|LLM_INSPECT|WEB_SEARCH)|APP_CLAW_LUA_DRIVER_(MCPWM|PCNT|TOUCH)|APP_CLAW_LUA_MODULE_(ENVIRONMENTAL_SENSOR|FUEL_GAUGE|IMU|IR|KNOB|MAGNETOMETER|LVGL)|BT_ENABLED)=' sdkconfig || true
          idf.py build

      - name: Create firmware images
        run: |
          . /opt/esp/idf/export.sh

          # First-flash image: one file for a blank board. This includes the
          # high-offset FAT system/storage partitions, so it is intentionally
          # close to 4 MB.
          esptool.py --chip esp32s3 merge_bin \
            -o build/esp-claw-esp32-s3-supermini-factory-full-merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 4MB \
            0x0 build/bootloader/bootloader.bin \
            0x9000 build/partition_table/partition-table.bin \
            0x20000 build/edge_agent.bin \
            0x300000 build/system.bin \
            0x3c0000 build/storage.bin

          cp build/bootloader/bootloader.bin build/esp-claw-esp32-s3-supermini-bootloader.bin
          cp build/partition_table/partition-table.bin build/esp-claw-esp32-s3-supermini-partition-table.bin
          cp build/edge_agent.bin build/esp-claw-esp32-s3-supermini-app.bin
          cp build/system.bin build/esp-claw-esp32-s3-supermini-system.bin
          cp build/storage.bin build/esp-claw-esp32-s3-supermini-storage.bin
          # ESP-Claw uses FAT for writable storage, not SPIFFS. Keep this
          # compatibility alias because many SuperMini flashing guides expect
          # a separately uploaded spiffs.bin.
          cp build/storage.bin build/spiffs.bin

          cat > build/first-flash-command.txt <<'EOF'
          python -m esptool --chip esp32s3 -b 460800 --before default_reset --after hard_reset write_flash --flash_mode dio --flash_size 4MB --flash_freq 80m 0x0 esp-claw-esp32-s3-supermini-factory-full-merged.bin
          EOF

          cat > build/upgrade-no-settings-command.txt <<'EOF'
          python -m esptool --chip esp32s3 -b 460800 --before default_reset --after hard_reset write_flash --flash_mode dio --flash_size 4MB --flash_freq 80m 0x0 esp-claw-esp32-s3-supermini-bootloader.bin 0x9000 esp-claw-esp32-s3-supermini-partition-table.bin 0x20000 esp-claw-esp32-s3-supermini-app.bin 0x300000 esp-claw-esp32-s3-supermini-system.bin
          EOF

          cat > build/upgrade-no-settings-readme.txt <<'EOF'
          Use upgrade-no-settings-command.txt for normal upgrades. This deliberately uses separate offset writes instead of a 0x0 merged image, because a 0x0 merged image would contain 0xff padding across the NVS settings partition.

          The command updates bootloader, partition table, app, and esp-claw-esp32-s3-supermini-system.bin at 0x300000 without touching NVS settings at 0xA000-0x19FFF or writable storage at 0x3C0000.

          To reset user files, flash esp-claw-esp32-s3-supermini-storage.bin or spiffs.bin separately at 0x3c0000.
          EOF

          ls -lh \
            build/esp-claw-esp32-s3-supermini-factory-full-merged.bin \
            build/esp-claw-esp32-s3-supermini-bootloader.bin \
            build/esp-claw-esp32-s3-supermini-partition-table.bin \
            build/esp-claw-esp32-s3-supermini-app.bin \
            build/esp-claw-esp32-s3-supermini-system.bin \
            build/esp-claw-esp32-s3-supermini-storage.bin \
            build/spiffs.bin

      - name: Show image sizes
        if: always()
        run: |
          . /opt/esp/idf/export.sh
          python $IDF_PATH/tools/idf_size.py build/edge_agent.elf || true
          python - <<'PY'
          from pathlib import Path
          app = Path("build/edge_agent.bin")
          limit = 2944 * 1024
          if app.exists():
              size = app.stat().st_size
              print(f"ESP32-S3 SuperMini app image: {size} bytes / {limit} bytes, free {limit - size} bytes")
          PY
          ls -lh build/*.bin build/partition_table/*.bin || true

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-supermini-firmware
          path: |
            application/edge_agent/build/esp-claw-esp32-s3-supermini-factory-full-merged.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-bootloader.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-partition-table.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-app.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-system.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-storage.bin
            application/edge_agent/build/spiffs.bin
            application/edge_agent/build/first-flash-command.txt
            application/edge_agent/build/upgrade-no-settings-command.txt
            application/edge_agent/build/upgrade-no-settings-readme.txt
            application/edge_agent/build/*.bin
            application/edge_agent/build/partition_table/*.bin
            application/edge_agent/build/bootloader/*.bin
            application/edge_agent/build/flasher_args.json
            application/edge_agent/build/project_description.json

      - name: Upload no-settings upgrade artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-supermini-upgrade-no-settings
          path: |
            application/edge_agent/build/esp-claw-esp32-s3-supermini-bootloader.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-partition-table.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-app.bin
            application/edge_agent/build/esp-claw-esp32-s3-supermini-system.bin
            application/edge_agent/build/upgrade-no-settings-command.txt
            application/edge_agent/build/upgrade-no-settings-readme.txt
