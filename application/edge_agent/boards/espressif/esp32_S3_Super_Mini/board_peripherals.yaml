version: 1.0.0
# Peripherals for ESP32-S3 SuperMini / ESP32-S3FH4R2.
# Reference board configuration: ysuolmai/xiaozhi-esp32s3-supermini.
peripherals:
  - name: rmt_tx
    type: rmt
    role: tx
    config:
      gpio_num: 48
      clk_src: RMT_CLK_SRC_DEFAULT
      resolution_hz: 10000000
      mem_block_symbols: 64
      trans_queue_depth: 4
      intr_priority: 1
      flags:
        invert_out: false
        with_dma: true
        io_loop_back: false
        io_od_mode: false
        allow_pd: false
        init_level: false
